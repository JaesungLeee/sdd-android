# 릴리스 준비: Claude가 마지막 릴리스 뒤의 변경으로 CHANGELOG 항목을 쓰고, 버전을 올린 PR을 연다.
# 사람이 PR에서 문구를 확인하고 머지하면 release.yml이 배포한다. 다시 돌리면 같은 PR을 갱신한다.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 올릴 버전 (X.Y.Z). 비우면 Claude가 변경 내용을 보고 정한다
        required: false
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # GITHUB_TOKEN으로 연 PR에서는 CI가 돌지 않는다. 저장소 전용 GitHub App의 토큰으로 연다
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: base
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*')
          current=$(node -p "require('./package.json').version")
          if [ "$last" != "v$current" ]; then
            echo "::error::package.json의 버전($current)과 마지막 태그($last)가 다르다. 앞 릴리스의 배포가 끝났는지 release.yml을 확인한다."
            exit 1
          fi
          if [ "$(git rev-list --count "$last..HEAD")" -eq 0 ]; then
            echo "::error::$last 뒤로 바뀐 것이 없다."
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ]; then
            rule="버전은 $INPUT_VERSION으로 정해져 있다."
          else
            rule="현재 버전은 $current다. 0.x 동안은 Added, Changed, Removed 중 하나라도 있으면 minor를, Fixed만 있으면 patch를 올린다."
          fi
          {
            echo "last=$last"
            echo "current=$current"
            echo "today=$(TZ=Asia/Seoul date +%F)"
            echo "rule=$rule"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        id: claude
        with:
          # 둘 중 등록한 하나를 쓴다
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            sdd-android의 다음 릴리스 항목을 CHANGELOG.md에 쓴다. 이 항목은 사용자가 `npx sdd-android@latest upgrade`를 실행할 때 그대로 보인다.

            - 마지막 릴리스는 ${{ steps.base.outputs.last }}다. `git log ${{ steps.base.outputs.last }}..HEAD`와 `git diff ${{ steps.base.outputs.last }}..HEAD`로 그 뒤의 변경을 본다.
            - CHANGELOG.md 맨 위 주석의 작성 규칙을 따르고, 기존 항목의 문체와 길이에 맞춘다.
            - 사용자가 CLI와 스킬을 쓰면서 겪는 변화만 쓴다. 테스트, 리팩터링, CI, 저장소 안의 개발용 문서만 바뀐 커밋은 적지 않는다.
            - 명령, 옵션, 파일 이름은 src/cli.ts와 guide/에서 확인해 실제와 맞춘다. 추측해서 쓰지 않는다.
            - 같은 릴리스 안에서 더했다가 고친 것은 고친 결과 하나로 적는다.
            - ${{ steps.base.outputs.rule }}
            - 제목은 `## [버전] - ${{ steps.base.outputs.today }}`이고, 지금 맨 위 항목의 위에 넣는다.
            - CHANGELOG.md만 고친다. package.json의 버전은 워크플로가 올린다.

            마치면 structured output을 낸다.
            - version: 제목에 쓴 버전.
            - summary: PR 본문(마크다운). 먼저 판단이 애매했던 커밋과 그 이유를 적고, 이어서 커밋마다 한 줄씩 어느 항목에 반영했는지 또는 왜 적지 않았는지를 표로 적는다.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"version":{"type":"string","pattern":"^[0-9]+\\.[0-9]+\\.[0-9]+$"},"summary":{"type":"string"}},"required":["version","summary"],"additionalProperties":false}'

      - name: Bump version
        id: bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRAFTED: ${{ fromJSON(steps.claude.outputs.structured_output).version }}
        run: |
          version=${INPUT_VERSION:-$DRAFTED}
          if [ "$version" != "$DRAFTED" ]; then
            echo "::error::Claude가 $DRAFTED로 썼다. 입력한 버전은 $version이다."
            exit 1
          fi
          npm version "$version" --no-git-tag-version
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Claude가 고친 파일은 CHANGELOG.md뿐이어야 한다. PR에는 아래 세 파일만 담긴다
      - name: Check changed files
        run: |
          unexpected=$(git diff --name-only | grep -vxE 'CHANGELOG\.md|package\.json|package-lock\.json' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::릴리스 준비에서 바뀌면 안 되는 파일이 바뀌었다: $unexpected"
            exit 1
          fi
          git diff --quiet -- CHANGELOG.md && { echo "::error::CHANGELOG.md가 바뀌지 않았다."; exit 1; }
          true

      - run: node scripts/release-check.mjs --latest "${{ steps.base.outputs.current }}"
      - run: npm run build
      - run: npm test

      - name: Write PR body
        env:
          SUMMARY: ${{ fromJSON(steps.claude.outputs.structured_output).summary }}
        run: |
          {
            printf '%s\n\n' "$SUMMARY"
            echo '---'
            echo
            echo 'CHANGELOG 항목은 Claude가 쓴 초안이다. `upgrade`에서 사용자에게 그대로 보이므로 문구를 확인하고, 고칠 것은 이 브랜치에 커밋한다.'
            echo '머지하면 release.yml이 npm 배포, 태그, GitHub Release를 처리한다.'
          } > "$RUNNER_TEMP/pr-body.md"

      - uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          token: ${{ steps.app.outputs.token }}
          branch: release-pr
          base: main
          add-paths: |
            CHANGELOG.md
            package.json
            package-lock.json
          commit-message: Release ${{ steps.bump.outputs.version }}
          title: Release ${{ steps.bump.outputs.version }}
          body-path: ${{ runner.temp }}/pr-body.md
          delete-branch: true
